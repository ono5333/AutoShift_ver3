facility_rules:
- description: 毎日、2名の夜勤スタッフを配置する
  id: FR001
  rank: A
  title: 夜勤は毎日2名配置
- description: 毎日、3名以上の日勤スタッフを配置する
  id: FR002
  rank: A
  title: 日勤は毎日3名以上配置
- description: 月曜日・木曜日は日勤+1名配置+お風呂1名
  id: FR003
  rank: A
  title: 月木のお風呂配置
- days: 12
  description: 1月の公休数は12日
  id: FR004
  month: 1
  rank: B
  title: 1月の公休
- days: 8
  description: 2月の公休数は8日
  id: FR005
  month: 2
  rank: A
  title: 2月の公休
- days: 9
  description: 3月～11月の公休数は9日
  id: FR006
  month:
  - 3
  - 4
  - 5
  - 6
  - 7
  - 8
  - 9
  - 10
  - 11
  rank: A
  title: 3月～11月の公休
- days: 11
  description: 12月の公休数は11日
  id: FR007
  month: 12
  rank: B
  title: 12月の公休
- description: 希望休は各月3日以内に限定
  id: FR008
  max_requests: 3
  rank: A
  title: 希望休申請上限
- description: 希望休は公休を指定できる制度なので日数としては公休数に含まれる
  id: FR009
  rank: A
  title: 希望休は公休に含まれる
- description: 有給は公休・希望休とは別に取得するものなので公休数には含めない
  id: FR010
  rank: A
  title: 有給は別計
- description: 日勤には1名以上の『介護士』が必ず配置されること
  id: FR011
  rank: A
  title: 日勤に介護士配置
- description: 夜勤[夜]の次の日は必ず夜勤明け[明]とする
  id: FR012
  rank: A
  title: 夜勤明けは必須
- description: 日勤の連続勤務は最大6日とする
  id: FR013
  max_consecutive_days: 6
  rank: A
  title: 連続勤務の上限
- days:
  - 1
  - 4
  description: 『お風呂担当』は月と木に1名以上配置する
  id: FR014
  rank: B
  title: お風呂担当の配置
- description: 月の日数 - 公休数の日数分勤務を割り当てる
  id: FR015
  rank: B
  title: 勤務日数の計算
- description: 『介護士』の勤務日数を平均化する
  id: FR016
  rank: C
  title: 介護士の勤務日数平均化
- constraint_type: holiday_adjacent_optimization
  description: 公休はなるべく、希望休、有給の前後どちらかに１日付与する
  id: FR017
  rank: C
  title: 公休の前後配置最適化
- constraint_type: max_consecutive_rest_days
  description: 休み（公休・希望休・有給）の連続は2日までとし、3連休以上は禁止する
  id: FR018
  max_consecutive_days: 2
  rank: B
  title: 連休制限と2連休促進
- constraint_type: request_limit_exempt_class
  description: 「お風呂」クラスはパート扱いのため希望休上限の対象外とする
  id: FR019
  rank: A
  staff_class: お風呂
  target_rule_id: FR008
  title: 希望休上限の職種除外
